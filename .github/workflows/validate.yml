# Pull request validation: lint and build (no Azure access), then what-if against dev and prod,
# then a guardrail test proving the PR identity cannot deploy.
# Signs in with OIDC as gh-cicd-plan (custom role "Bicep What-If Reader": read + what-if + validate only).
name: validate

on:
  pull_request:
    branches: [main]

# Default for every job: read the repo, nothing else. Jobs that sign in to Azure add id-token: write.
permissions:
  contents: read

# A new push to the same PR cancels the run that's still in progress.
concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BICEP_VERSION: v0.48.1        # same version as local development, so results match
  AZURE_CORE_NO_COLOR: 'true'   # plain-text az output for logs and summaries
  # Public repo: logs mask secrets, but not other IDs (for example, object IDs in error messages).
  # Anything printed from az is passed through this pattern first.
  GUID_PATTERN: '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'

defaults:
  run:
    shell: bash                 # bash with -e -o pipefail: any failing command fails the step

jobs:
  lint:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pinned Bicep
        run: |
          az bicep install --version "$BICEP_VERSION"
          az bicep version

      - name: Lint main.bicep (bicepconfig.json rules)
        run: az bicep lint --file infra/main.bicep

      - name: Subnet layout check (inside VNet, no overlaps)
        # M4b prevention: an overlapping subnet passes lint, types, and what-if, and only fails at deploy time
        # (NetcfgSubnetRangesOverlap). This catches it before merge, with no Azure access.
        shell: pwsh
        run: ./scripts/Test-SubnetLayout.ps1 -ParamFile infra/params/dev.bicepparam, infra/params/prod.bicepparam

      - name: Build parameter files (type checks)
        run: |
          for env in dev prod; do
            echo "build-params $env"
            az bicep build-params --file "infra/params/$env.bicepparam" --stdout > /dev/null
          done

  whatif:
    name: What-if (${{ matrix.environment }})
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write           # lets the job request a GitHub OIDC token for azure/login
    strategy:
      fail-fast: false          # show both environments even if one fails
      matrix:
        environment: [dev, prod]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pinned Bicep
        run: az bicep install --version "$BICEP_VERSION"

      - name: Azure login (OIDC, plan identity)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_PLAN }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: What-if against rg-cicd-${{ matrix.environment }}
        env:
          ENV_NAME: ${{ matrix.environment }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SUB_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          # ProviderNoRbac: full template and resource validation, but the permission check only needs read access.
          az deployment group what-if \
            --resource-group "rg-cicd-$ENV_NAME" \
            --name "pr-$PR_NUMBER-$ENV_NAME" \
            --template-file infra/main.bicep \
            --parameters "infra/params/$ENV_NAME.bicepparam" \
            --validation-level ProviderNoRbac > whatif.txt
          # Sanitize before printing anywhere: subscription ID (a secret, masked in logs but not guaranteed in
          # summaries) and any other GUID.
          sed -E -e "s/$SUB_ID/<subscription>/g" -e "s/$GUID_PATTERN/<guid>/g" whatif.txt > whatif-clean.txt
          cat whatif-clean.txt
          {
            echo "## What-if: $ENV_NAME"
            echo '```'
            cat whatif-clean.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  guardrail:
    name: Guardrail - plan identity cannot deploy
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pinned Bicep
        run: az bicep install --version "$BICEP_VERSION"

      - name: Azure login (OIDC, plan identity)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID_PLAN }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Attempt a real deployment (must be refused with 403 AuthorizationFailed)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set +e
          out=$(az deployment group create \
            --resource-group rg-cicd-dev \
            --name "guardrail-pr-$PR_NUMBER" \
            --template-file infra/main.bicep \
            --parameters infra/params/dev.bicepparam 2>&1)
          rc=$?
          set -e
          # Print only with every GUID redacted: the error text includes the identity's object ID, which logs don't mask.
          echo "$out" | sed -E "s/$GUID_PATTERN/<guid>/g"
          if [ "$rc" -eq 0 ]; then
            echo "::error::The plan identity deployed successfully. Its role is too broad; fix it before merging."
            exit 1
          fi
          # Azure refuses in one of two ways (M2 finding): during preflight validation, as InvalidTemplateDeployment
          # containing "Authorization failed for template resource", or at deploy time with code AuthorizationFailed.
          # Both must name the missing write permission on deployments.
          if echo "$out" | grep -Eq 'AuthorizationFailed|Authorization failed for template resource' \
             && echo "$out" | grep -q "does not have permission to perform action 'Microsoft.Resources/deployments/write'"; then
            echo "Refused: no permission for Microsoft.Resources/deployments/write, as designed."
            echo "## Guardrail: PASS. The PR identity was refused (no deployments/write permission) when it tried to deploy." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::The deployment failed, but not with an authorization refusal. Check the output above."
            exit 1
          fi
